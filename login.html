<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your PolyAuth account.">
  <title>Log In - PolyAuth System</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-shield-lock-fill text-primary"></i>
        <span>PolyAuth Stack</span>
      </a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span class="text-muted small d-none d-md-inline">Need an account?</span>
        <a href="register.html" class="btn btn-gradient-primary btn-sm px-3">
          <i class="bi bi-person-plus-fill me-1"></i> Register
        </a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        
        <div class="glass-card p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-20 text-primary border border-primary border-opacity-25 mb-3">
              <i class="bi bi-shield-lock-fill fs-2"></i>
            </div>
            <h2 class="fw-bold text-white mb-2">Welcome Back</h2>
            <p class="text-muted">Enter your credentials to verify password against MySQL & activate Redis session.</p>
          </div>

          <!-- Alert Container for AJAX Responses -->
          <div id="alertContainer" class="mb-4 d-none"></div>

          <!-- Login Form (Handled via jQuery AJAX) -->
          <form id="loginForm" novalidate>
            
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" placeholder="john@example.com" required>
              </div>
            </div>

            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center">
                <label for="password" class="form-label">Password</label>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="••••••••" required>
              </div>
            </div>

            <div class="d-grid gap-2 mb-4">
              <button type="submit" id="btnLogin" class="btn btn-gradient-primary btn-lg">
                <span id="btnText"><i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Dashboard</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
              </button>
            </div>

          </form>

        </div>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-4 text-center text-muted fs-7 mt-auto">
    <div class="container">
      <p class="mb-0">&copy; 2026 PolyAuth System.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
